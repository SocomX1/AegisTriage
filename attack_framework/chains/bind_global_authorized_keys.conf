# chains/bind_sudoers_global_authorized_keys.conf
#
# Multi-step chain:
#
#   1. Modify sudoers through an automated bind shell.
#   2. Add a global SSH authorized_keys path and key through the same delivery.

NAME="bind_global_authorized_keys"

DESCRIPTION="Use an automated bind shell to modify sudoers, then install global SSH authorized_keys persistence."

CHAIN_CATEGORY="multi_stage"

FAIL_POLICY="fail_fast"

CLEANUP_MODE="mixed"

STEP_MARKERS="true"

CHAIN_METADATA="true"

STEPS=(
    "bind_shell/bash_auto:persistence_auth/authorized_keys_global"
)

CATEGORIES=(
    "persistence_auth"
)

AUDIT_RELEVANT="true"

# Expected target-side signals:
#
#   - bind shell command execution
#   - sudoers modification
#   - sshd_config AuthorizedKeysFile modification
#   - /etc/ssh/.ssh/authorized_keys creation or append
#   - timestamp and dpkg md5sum tampering
