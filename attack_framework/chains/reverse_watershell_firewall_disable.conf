# chains/reverse_watershell_firewall_disable.conf
#
# Multi-step chain:
#
#   1. Install Watershell-backed systemd persistence over an automated reverse shell.
#   2. Disable firewall mechanisms over an automated reverse shell.

NAME="reverse_watershell_firewall_disable"

DESCRIPTION="Use an automated reverse shell to install Watershell systemd persistence and disable local firewall controls."

CHAIN_CATEGORY="multi_stage"

FAIL_POLICY="fail_fast"

CLEANUP_MODE="mixed"

STEP_MARKERS="true"

CHAIN_METADATA="true"

STEPS=(
    "reverse_shell/powershell_socat_auto:persistence_tasks/systemd_watershell"
    "reverse_shell/powershell_socat_auto:vandalism/firewall_disable"
)

CATEGORIES=(
    "persistence_tasks"
    "vandalism"
)

AUDIT_RELEVANT="true"

# Expected target-side signals:
#
#   - reverse shell command execution
#   - randomized systemd unit creation under /etc
#   - Watershell compilation and service start
#   - firewalld, ufw, nftables, iptables, and ip6tables tampering
