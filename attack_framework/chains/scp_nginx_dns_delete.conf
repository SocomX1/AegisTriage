# chains/scp_nginx_dns_delete.conf
#
# Multi-step chain:
#
#   1. Upload and execute nginx deletion payload over SCP then SSH.
#   2. Upload and execute DNS deletion payload over SCP then SSH.

NAME="scp_nginx_dns_delete"

DESCRIPTION="Use SCP then SSH delivery to delete nginx and DNS-related configuration artifacts."

CHAIN_CATEGORY="multi_stage"

FAIL_POLICY="fail_fast"

CLEANUP_MODE="mixed"

STEP_MARKERS="true"

CHAIN_METADATA="true"

STEPS=(
    "scp_then_ssh:vandalism/nginx_delete"
    "scp_then_ssh:vandalism/dns_delete"
)

CATEGORIES=(
    "vandalism"
)

AUDIT_RELEVANT="true"

# Expected target-side signals:
#
#   - SCP payload staging under randomized remote staging directories
#   - nginx configuration deletion
#   - DNS configuration deletion
