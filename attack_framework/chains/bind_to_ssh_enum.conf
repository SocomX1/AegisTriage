# chains/bind_to_ssh_enum.conf
#
# Multi-step chain:
#
#   1. Use a bind shell to create a persistence account.
#   2. Re-enter through SSH authentication using the created account.
#   3. Modify sudoers to establish privilege escalation persistence.
#   4. Perform post-exploitation reconnaissance using the SSH-authenticated session.
#
# This chain is intended to model:
#
#   initial shell access -> auth persistence -> valid-account re-entry
#   -> privilege escalation -> post-exploitation reconnaissance
#
# Notes:
#   - run_chain.sh should generate CHAIN_ID once and pass it to every step.
#   - The create_user step should record created_user and password in metadata.
#   - Subsequent ssh_auth steps should consume created_user/password values.
#
# Expected variable mapping:
#
#   created_user -> USERNAME
#   password     -> PASSWORD

NAME="bind_to_ssh_enum"

DESCRIPTION="Bind shell establishes a persistence account, SSH re-entry modifies sudoers, then performs reconnaissance."

CHAIN_CATEGORY="multi_stage"

FAIL_POLICY="fail_fast"

CLEANUP_MODE="mixed"

STEP_MARKERS="true"

CHAIN_METADATA="true"

STEPS=(
    "bind_shell/bash_auto:persistence_auth/create_user"
    "bind_shell/bash_auto:priv_esc/sudoers_mod"
    "ssh_auth:recon/basic_enum"
)

STEP_OUTPUT_MAP=(
    "1:created_user:2:USERNAME"
    "1:password:2:PASSWORD"

    "1:created_user:3:USERNAME"
    "1:password:3:PASSWORD"
)

CATEGORIES=(
    "shells"
    "persistence_auth"
    "priv_esc"
    "recon"
)

AUDIT_RELEVANT="true"

# Expected target-side signals:
#
#   - inbound bind-shell connection
#   - useradd / passwd / shadow modification
#   - SSH login using created account
#   - sudoers modification
#   - sudo authentication events
#   - system and network enumeration activity
#
# This chain is useful for evaluating whether the model detects
# multi-stage attacker progression across authentication,
# persistence, privilege escalation, and reconnaissance.

# Cleanup notes:
#
#   - create_user supports cleanup
#   - sudoers_mod may require manual review/restoration
#   - reconnaissance artifacts are generally low-impact
#
# Recommended lab reset:
#   - remove created account
#   - revert sudoers changes
