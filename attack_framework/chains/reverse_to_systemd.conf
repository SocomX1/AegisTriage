# chains/reverse_to_systemd.conf
#
# Simulates a multi-stage intrusion chain:
#
#   1. Initial reverse-shell compromise
#   2. Installation of systemd-based persistence
#   3. Optional follow-on activity
#
# Intended to generate realistic audit activity spanning:
#
#   - shell access
#   - persistence establishment
#   - service installation
#   - daemon reloads
#   - staged payload execution
#
# Intended only for local lab/VM environments.

NAME="reverse_to_systemd"

CHAIN_DESCRIPTION="Reverse shell compromise followed by systemd persistence"

# Default cleanup policy for the chain.
#
# Supported:
#   none
#   partial
#   full
#
CHAIN_CLEANUP_MODE="partial"

# Whether execution should stop immediately if a step fails.
FAIL_FAST="true"

# Optional delays between chain stages.
ENABLE_STEP_DELAYS="true"

STEP_DELAY_SECONDS="2"

# Metadata behavior
RECORD_CHAIN_PROGRESS="true"

# Recommended reverse-shell delivery vector.
DEFAULT_REVERSE_SHELL="reverse_shell/powershell_socat_auto"

# Chain steps
#
# Format:
#   delivery:payload
#
# Step 1:
#   Gain shell access
#
# Step 2:
#   Install systemd persistence
#
STEPS=(
    "reverse_shell/bash_auto:recon/basic_enum"
    "reverse_shell/bash_auto:persistence_tasks/systemd_service"
)

# Cleanup guidance
#
# systemd persistence cleanup generally requires:
#
#   - disabling the service
#   - stopping the service
#   - removing the unit file
#   - daemon-reload
#
MANUAL_CLEANUP_HINT="Disable and remove framework-installed systemd services if automatic cleanup is disabled."

# Audit relevance:
#
# This chain intentionally produces:
#
#   - shell_exec
#   - exec
#   - network_connect
#   - persistence
#   - etc_changes
#   - chmod_change
#
# and potentially:
#
#   - service management activity
#   - daemon-reload events
#
# depending on system configuration.
