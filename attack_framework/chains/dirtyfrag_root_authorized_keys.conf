# chains/dirtyfrag_root_authorized_keys.conf
#
# Multi-step chain:
#
#   1. Create a persistence account over SSH stdin.
#   2. Re-enter with the created account and establish a DirtyFrag root session.
#   3. Reuse the preserved root shell to append a fake key to root's
#      authorized_keys file.

NAME="dirtyfrag_root_authorized_keys"

DESCRIPTION="Create an account, preserve a DirtyFrag root shell, then add a fake SSH key to /root/.ssh/authorized_keys."

CHAIN_CATEGORY="multi_stage"

FAIL_POLICY="fail_fast"

CLEANUP_MODE="mixed"

STEP_MARKERS="true"

CHAIN_METADATA="true"

# Keep DirtyFrag session artifacts alive for root_session steps, then remove the
# session workdir at chain exit.
CHAIN_DEFER_SHELL_SESSION_CLEANUP="true"

STEPS=(
    "ssh_stdin:persistence_auth/create_user"
    "ssh_auth:priv_esc/root_dirtyfrag"
    "root_session:persistence_auth/authorized_keys"
    "root_session:priv_esc/sudoers_mod"
)

# The create_user step exports TARGET_USER as the created account. Override only
# TARGET_USER for step 3 so authorized_keys writes to /root/.ssh/authorized_keys,
# while USERNAME/PASSWORD remain the created account used by root_session for SSH
# transport to the FIFO.
STEP_3_ENV=(
    "TARGET_USER=root"
)

STEP_OUTPUT_MAP=(
    "1:created_user:2:USERNAME"
    "1:password:2:PASSWORD"
    "2:shell_session_input:3:AEGIS_SHELL_SESSION_INPUT"
    "2:shell_session_transcript:3:AEGIS_SHELL_SESSION_TRANSCRIPT"
)

CATEGORIES=(
    "persistence_auth"
    "priv_esc"
)

AUDIT_RELEVANT="true"

# Expected target-side signals:
#
#   - useradd / passwd / shadow modification
#   - SSH login as the created account
#   - DirtyFrag clone, compilation, and exploit execution
#   - root shell command execution through the preserved session
#   - /root/.ssh/authorized_keys modification
