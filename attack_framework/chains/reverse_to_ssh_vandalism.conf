# chains/reverse_to_ssh_vandalism.conf
#
# Multi-step chain:
#
#   1. Use a PowerShell-backed reverse shell to create a persistence account.
#   2. Re-enter through SSH authentication using the created account.
#   3. Execute a vandalism payload through the SSH-authenticated session.
#
# This chain is intended to model:
#
#   initial shell access -> auth persistence -> valid-account re-entry -> service vandalism
#
# Notes:
#   - run_chain.sh should generate CHAIN_ID once and pass it to every step.
#   - The create_user step should record created_user and password in metadata.
#   - The ssh_auth step should consume the created_user/password values.
#   - If automatic variable passing is not yet implemented, run step 2 manually
#     with USERNAME and PASSWORD exported from step 1 metadata.

NAME="reverse_to_ssh_vandalism"

DESCRIPTION="Initial reverse shell creates a persistence account, then SSH re-entry is used to execute nginx vandalism."

CHAIN_CATEGORY="multi_stage"

FAIL_POLICY="fail_fast"

CLEANUP_MODE="mixed"

# Whether each step should send its own START/END markers.
STEP_MARKERS="true"

# Whether the chain runner should write chain-level metadata.
CHAIN_METADATA="true"

# Expected chain-level behavior:
#
#   Step 1:
#     delivery = reverse_shell/powershell_auto
#     payload  = persistence_auth/create_user
#
#   Step 2:
#     delivery = ssh_auth
#     payload  = vandalism/nginx_delete
#
# In a future chain runner, the output variable:
#
#   created_user
#
# from step 1 should be mapped into:
#
#   USERNAME
#
# for step 2. The password recorded by create_user should be mapped into:
#
#   PASSWORD
#
# for step 2.

STEPS=(
    "reverse_shell/powershell_socat_auto:persistence_auth/create_user"
    "ssh_auth:vandalism/nginx_delete"
)

# Output-to-input variable mapping for chain-aware runners.
#
# Format:
#   "<source_step>:<metadata_key>:<destination_step>:<environment_variable>"
#
# This is declarative documentation for now, but can be used later by
# run_chain.sh to automatically carry variables forward.

STEP_OUTPUT_MAP=(
    "1:created_user:2:USERNAME"
    "1:password:2:PASSWORD"
)

# Categories touched by this chain.
CATEGORIES=(
    "shells"
    "persistence_auth"
    "vandalism"
)

# Audit relevance:
#
# Expected target-side signals include:
#
#   - reverse shell process execution
#   - outbound network connection
#   - useradd / identity file changes
#   - /home/<user>/.ssh activity
#   - SSH login as created account
#   - deletion of /etc/nginx
#
# This makes the chain useful for evaluating whether the model detects
# malicious behavior across multiple stages rather than isolated commands.

AUDIT_RELEVANT="true"

# Cleanup notes:
#
# The create_user payload has cleanup support.
# The nginx_delete payload is destructive and uses manual cleanup by design.
#
# Recommended lab reset:
#   - run create_user cleanup if needed
#   - restore nginx from snapshot/package reinstall/backup
