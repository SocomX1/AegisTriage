# chains/suid_exec_dns_vandalism.conf
#
# Multi-step chain:
#
#   1. Load a previously persisted SUID root execution capability.
#   2. Run reconnaissance through the SUID root primitive.
#   3. Disable DNS through the SUID root primitive.
#   4. Tamper DNS configuration through the SUID root primitive.

NAME="suid_exec_dns_vandalism"

DESCRIPTION="Reuse a persisted SUID root execution capability for recon and DNS vandalism."

CHAIN_CATEGORY="multi_stage"

FAIL_POLICY="fail_fast"

CLEANUP_MODE="mixed"

STEP_MARKERS="true"

CHAIN_METADATA="true"

LOAD_TARGET_CAPABILITIES="true"

STEPS=(
    "suid_exec:recon/basic_enum"
    "suid_exec:vandalism/dns_disable"
    "suid_exec:vandalism/dns_tamper"
)

CATEGORIES=(
    "recon"
    "vandalism"
)

AUDIT_RELEVANT="true"

# Expected target-side signals:
#
#   - SUID bash root execution
#   - host and network enumeration
#   - DNS service/configuration disruption
