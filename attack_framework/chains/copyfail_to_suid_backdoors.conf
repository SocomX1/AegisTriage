# chains/copyfail_to_suid_backdoors.conf
#
# Multi-step chain:
#
#   1. Establish a preserved root shell through Copy.Fail.
#   2. Use that root session to install SUID root execution backdoors.
#
# The second step publishes root_exec_* metadata, which run_chain.sh persists
# under runs/capabilities/<target>/root_exec.env by default.

NAME="copyfail_to_suid_backdoors"

DESCRIPTION="Use Copy.Fail to gain a preserved root session, then install SUID root execution backdoors."

CHAIN_CATEGORY="multi_stage"

FAIL_POLICY="fail_fast"

CLEANUP_MODE="mixed"

STEP_MARKERS="true"

CHAIN_METADATA="true"

CHAIN_DEFER_SHELL_SESSION_CLEANUP="true"

PERSIST_TARGET_CAPABILITIES="true"

STEPS=(
    "ssh_auth:priv_esc/root_copyfail"
    "root_session:priv_esc/suid_tool_backdoors"
)

CATEGORIES=(
    "priv_esc"
)

AUDIT_RELEVANT="true"

# Expected target-side signals:
#
#   - SSH login through valid credentials
#   - Copy.Fail exploit execution
#   - preserved root shell command execution
#   - chmod SUID changes
#   - suspicious bash copy to /usr/lib/openssh/ssh-keygen
