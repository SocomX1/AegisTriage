# chains/reverse_to_cron.conf
#
# Simulates a multi-stage intrusion chain:
#
#   1. Initial reverse-shell compromise
#   2. Installation of cron-based persistence
#   3. Optional follow-on reconnaissance
#
# Intended to generate realistic chained audit activity spanning:
#
#   - shell access
#   - persistence establishment
#   - staged payload creation
#   - recurring execution mechanisms
#
# Intended only for local lab/VM environments.

NAME="reverse_to_cron"

CHAIN_DESCRIPTION="Reverse shell compromise followed by cron persistence"

# Default cleanup policy for the chain.
#
# Supported:
#   none
#   partial
#   full
#
CHAIN_CLEANUP_MODE="partial"

# Whether the chain should stop immediately on step failure.
FAIL_FAST="true"

# Whether to insert delays between steps.
ENABLE_STEP_DELAYS="true"

STEP_DELAY_SECONDS="2"

# Metadata behavior
RECORD_CHAIN_PROGRESS="true"

# Recommended delivery vector.
#
# Override at runtime if desired.
DEFAULT_REVERSE_SHELL="reverse_shell/powershell_socat_auto"

# Chain steps
#
# Format:
#   delivery:payload
#
# Step 1:
#   Gain shell access
#
# Step 2:
#   Install cron persistence
#
# Step 3:
#   Optional lightweight recon
#
STEPS=(
    "reverse_shell/bash_auto:recon/basic_enum"
    "reverse_shell/bash_auto:persistence_tasks/cron_job"
)

# Cleanup guidance
#
# Cron persistence cleanup can usually be handled automatically using:
#
#   payloads/persistence_tasks/cron_job/cleanup.sh
#
MANUAL_CLEANUP_HINT="Remove cron persistence artifacts if automatic cleanup is disabled."

# Audit relevance:
#
# This chain intentionally produces:
#
#   - shell_exec
#   - exec
#   - network_connect
#   - persistence
#   - tmp_activity
#   - chmod_change
#
# plus whatever cron execution activity occurs later.
