# payloads/persistence_auth/authorized_keys_global/payload.conf
#
# Installs a randomized SSH key in /etc/ssh/.ssh/authorized_keys and configures
# sshd to read that global path.
#
# Category:
#   persistence_auth

NAME="authorized_keys_global"

CATEGORY="persistence_auth"

PRIVILEGE="sudo"

FAIL_POLICY="fail_fast"

# Cleanup is intentionally disabled by default for this module.
CLEANUP_MODE="none"

RANDOMIZE="true"

USES_TEMPLATE_NAMES="false"

# SSH persistence behavior
GLOBAL_SSH_DIR="/etc/ssh/.ssh"

GLOBAL_AUTHORIZED_KEYS="/etc/ssh/.ssh/authorized_keys"

SSHD_CONFIG="/etc/ssh/sshd_config"

AUTHORIZED_KEYS_FILE_DIRECTIVE="AuthorizedKeysFile .ssh/authorized_keys /etc/ssh/.ssh/authorized_keys"

# Fake key generation behavior
KEY_TYPE="ssh-ed25519"

KEY_RANDOM_LENGTH="24"

KEY_COMMENT_MODE="randomized"

KEY_COMMENT_TEMPLATE="root@localhost"

# Timestamp behavior
RESTORE_TIMESTAMPS="true"

REFERENCE_TIMESTAMP_FILE="/etc/ssh/ssh_config"

# Dpkg metadata behavior
TAMPER_DPKG_MD5SUMS="true"

DPKG_INFO_DIR="/var/lib/dpkg/info"

DPKG_MDSUM_GLOB="*ssh*.md5sums"

DPKG_REFERENCE_TIMESTAMP_FILE="/var/lib/dpkg/info/linux-base.md5sums"

# Service behavior
RESTART_SSH="true"

# Cleanup behavior
ENABLE_CLEANUP="false"

# Audit relevance:
#
# This payload intentionally generates:
#
#   - persistence_auth
#   - root_ssh_keys
#   - sshd_config modification
#   - timestamp manipulation
#   - dpkg metadata modification
#   - service restart activity

AUDIT_RELEVANT="true"
