# payloads/persistence_auth/create_user/payload.conf
#
# Creates a new local user account to simulate auth-based persistence.
#
# The username is selected from a curated template pool, optionally with a
# random suffix to reduce model bias. The password is reusable by design so
# later chain steps can reconnect through ssh_auth.
#
# Category:
#   persistence_auth

NAME="create_user"

CATEGORY="persistence_auth"

PRIVILEGE="sudo"

FAIL_POLICY="fail_fast"

CLEANUP_MODE="default"

RANDOMIZE="true"

USES_TEMPLATE_NAMES="true"

USERNAME_TEMPLATE_POOL="usernames"

APPEND_RANDOM_SUFFIX="true"

USERNAME_RANDOM_LENGTH="5"

PASSWORD_MODE="random"
PASSWORD_RANDOM_LENGTH="18"

DEFAULT_PASSWORD="ReusableLabPassword123!"

CREATE_HOME="true"

LOGIN_SHELL="/bin/bash"

ADD_TO_SUDO_GROUP="false"

WRITE_AUTHORIZED_KEYS="true"

AUTHORIZED_KEYS_MODE="dummy"

RECORD_CREATED_USER="true"

RECORD_PASSWORD="true"

AUDIT_RELEVANT="true"
