# payloads/persistence_auth/authorized_keys/payload.conf
#
# Installs or appends a realistic-looking SSH public key into a target user's
# authorized_keys file to simulate SSH-based persistence.
#
# This payload is intended to model:
#
#   - attacker persistence through SSH access
#   - modification of .ssh directories
#   - creation/modification of authorized_keys
#
# The key content is intentionally fake/non-functional by default because the
# framework primarily uses reusable passwords for actual authentication.
#
# Category:
#   persistence_auth

NAME="authorized_keys"

CATEGORY="persistence_auth"

PRIVILEGE="sudo"

FAIL_POLICY="fail_fast"

CLEANUP_MODE="default"

RANDOMIZE="true"

USES_TEMPLATE_NAMES="true"

# User selection
#
# If TARGET_USER is supplied externally, the payload uses it. Otherwise it
# falls back to USERNAME, then the current execution user. Template selection
# remains available through TARGET_USER_MODE=external_or_template.
TARGET_USER_MODE="external_or_current"

USERNAME_TEMPLATE_POOL="usernames"

APPEND_RANDOM_SUFFIX="false"

# SSH persistence behavior
CREATE_SSH_DIR="true"

CREATE_AUTHORIZED_KEYS="true"

APPEND_MODE="true"

# Fake key generation behavior
AUTHORIZED_KEYS_MODE="dummy"

KEY_TYPE="ssh-ed25519"

KEY_COMMENT_MODE="randomized"

KEY_COMMENT_TEMPLATE="{username}@lab"

KEY_RANDOM_LENGTH="24"

# File permissions
SSH_DIR_MODE="700"
AUTHORIZED_KEYS_MODE_PERMS="600"

# Metadata behavior
RECORD_TARGET_USER="true"
RECORD_AUTHORIZED_KEYS_PATH="true"
RECORD_KEY_COMMENT="true"

# Cleanup behavior
REMOVE_ONLY_FRAMEWORK_KEYS="true"

# Audit relevance:
#
# This payload intentionally generates:
#
#   - home_activity
#   - root_ssh_keys (if targeting root)
#   - chmod_change
#   - owner_change
#
# depending on audit rules and target user.

AUDIT_RELEVANT="true"
