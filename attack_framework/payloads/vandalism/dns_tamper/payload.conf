# payloads/vandalism/dns_tamper/payload.conf
#
# Simulates DNS configuration vandalism by commenting out active lines in
# DNS-related configuration files without deleting the files.
#
# This payload is intentionally disruptive inside the local lab VM, but is
# designed to be reversible from the recorded backup.
#
# Category:
#   vandalism

NAME="dns_tamper"

CATEGORY="vandalism"

PRIVILEGE="sudo"

FAIL_POLICY="fail_fast"

CLEANUP_MODE="manual"

RANDOMIZE="false"

USES_TEMPLATE_NAMES="false"

# DNS target selection
#
# Supported:
#   resolv_conf
#   bind
#   dnsmasq
#   custom
#
# "custom" requires TARGET_PATH to be set externally.
TARGET_MODE="resolv_conf"

# Common DNS-related targets.
RESOLV_CONF_PATH="/etc/resolv.conf"

BIND_PATH="/etc/bind"

DNSMASQ_PATH="/etc/dnsmasq.d"

# Optional custom target path.
TARGET_PATH=""

# Safety checks
REQUIRE_PATH_EXISTS="true"

# Backup behavior
CREATE_BACKUP_BEFORE_TAMPER="false"

BACKUP_DIR="/var/tmp/aegis_backups"

# Tamper behavior
#
# Active lines are lines whose first non-whitespace character is not "#".
# Blank lines are skipped by default because they do not affect DNS behavior.
COMMENT_BLANK_LINES="false"

# Metadata behavior
RECORD_TARGET_MODE="true"
RECORD_TARGET_PATH="true"
RECORD_TARGET_KIND="true"
RECORD_BACKUP_PATH="true"

# Cleanup behavior
#
# Restore from the recorded backup path or a VM snapshot.
MANUAL_CLEANUP_HINT="Restore DNS configuration from recorded backup_path or VM snapshot."

# Audit relevance:
#
# This payload intentionally generates:
#
#   - exec
#   - shell_exec
#   - etc_changes
#   - config-file write activity
#
# without deleting DNS configuration files.

AUDIT_RELEVANT="true"
