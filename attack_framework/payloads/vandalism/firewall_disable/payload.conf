# payloads/vandalism/firewall_disable/payload.conf
#
# Simulates firewall vandalism by disabling common Linux firewall mechanisms and
# flushing packet-filtering rules.
#
# Category:
#   vandalism

NAME="firewall_disable"

CATEGORY="vandalism"

PRIVILEGE="sudo"

FAIL_POLICY="fail_fast"

CLEANUP_MODE="manual"

RANDOMIZE="false"

USES_TEMPLATE_NAMES="false"

# Firewall mechanisms
DISABLE_FIREWALLD="true"

DISABLE_UFW="true"

FLUSH_NFTABLES="true"

FLUSH_IPTABLES="true"

FLUSH_IP6TABLES="true"

SET_ACCEPT_POLICIES="true"

# Netfilter targets
IPTABLES_TABLES="filter nat mangle raw security"

IPTABLES_CHAINS="INPUT FORWARD OUTPUT"

# Cleanup behavior
#
# This module does not automatically restore firewall state. Restore manually
# from system policy, configuration management, or VM snapshot.
MANUAL_CLEANUP_HINT="Restore firewall state from policy/configuration management or VM snapshot."

# Audit relevance:
#
# This payload intentionally generates:
#
#   - firewall service stop/disable activity
#   - nft flush ruleset activity
#   - iptables/ip6tables flush and policy changes
#   - service disruption signals

AUDIT_RELEVANT="true"
