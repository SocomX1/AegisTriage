# payloads/vandalism/nginx_delete/payload.conf
#
# Simulates service vandalism by deleting the nginx configuration/service
# directory.
#
# This payload is intentionally destructive inside the local lab VM. It is meant
# to produce clear filesystem deletion/modification signals for audit.log data
# collection.
#
# Category:
#   vandalism

NAME="nginx_delete"

CATEGORY="vandalism"

PRIVILEGE="sudo"

FAIL_POLICY="fail_fast"

CLEANUP_MODE="manual"

RANDOMIZE="false"

USES_TEMPLATE_NAMES="false"

# Target path
TARGET_PATH="/etc/nginx"

# Safety checks
#
# REQUIRE_PATH_EXISTS=true means the payload fails if /etc/nginx does not exist.
# This prevents accidentally labeling a no-op as successful vandalism.
REQUIRE_PATH_EXISTS="true"

# Optional backup
#
# If true, the payload creates a tar backup before deletion.
# This adds extra audit noise, so leave false for cleaner vandalism-only traces.
CREATE_BACKUP_BEFORE_DELETE="false"

BACKUP_DIR="/var/tmp/aegis_backups"

# Deletion behavior
DELETE_COMMAND="rm -rf"

# Metadata behavior
RECORD_TARGET_PATH="true"
RECORD_BACKUP_PATH="true"

# Cleanup behavior
#
# Because this payload deletes service files, automatic cleanup is not enabled.
# Restore from VM snapshot, package reinstall, or backup if CREATE_BACKUP_BEFORE_DELETE=true.
MANUAL_CLEANUP_HINT="Restore /etc/nginx from snapshot, package reinstall, or recorded backup."

# Audit relevance:
#
# This payload intentionally generates:
#
#   - exec
#   - shell_exec
#   - etc_changes
#
# and may generate many file deletion/change events beneath /etc/nginx depending
# on audit rule behavior.

AUDIT_RELEVANT="true"
