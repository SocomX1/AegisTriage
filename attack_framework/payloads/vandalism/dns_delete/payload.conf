# payloads/vandalism/dns_delete/payload.conf
#
# Simulates DNS/service vandalism by deleting common DNS resolver or service
# configuration paths from the target VM.
#
# This payload is intentionally destructive inside the local lab VM and is
# intended to generate filesystem/service disruption audit activity.
#
# Category:
#   vandalism

NAME="dns_delete"

CATEGORY="vandalism"

PRIVILEGE="sudo"

FAIL_POLICY="fail_fast"

CLEANUP_MODE="manual"

RANDOMIZE="false"

USES_TEMPLATE_NAMES="false"

# DNS target selection
#
# Supported:
#   resolv_conf
#   bind
#   dnsmasq
#   custom
#
# "custom" requires TARGET_PATH to be set externally.
TARGET_MODE="resolv_conf"

# Common DNS-related targets
#
# These are intentionally configurable because Linux distributions differ.
RESOLV_CONF_PATH="/etc/resolv.conf"

BIND_PATH="/etc/bind"

DNSMASQ_PATH="/etc/dnsmasq.d"

# Optional custom target path
TARGET_PATH=""

# Safety checks
REQUIRE_PATH_EXISTS="true"

# Optional backup behavior
CREATE_BACKUP_BEFORE_DELETE="false"

BACKUP_DIR="/var/tmp/aegis_backups"

# Deletion behavior
DELETE_COMMAND="rm -rf"

# Metadata behavior
RECORD_TARGET_MODE="true"
RECORD_TARGET_PATH="true"
RECORD_BACKUP_PATH="true"

# Cleanup behavior
#
# DNS/service vandalism is intentionally disruptive, so automatic cleanup is
# not enabled by default.
#
# Restoration is expected through:
#   - VM snapshots
#   - package reinstall
#   - manual config restoration
#   - recorded backup archives
#
MANUAL_CLEANUP_HINT="Restore DNS configuration from snapshot, package reinstall, or backup."

# Audit relevance:
#
# This payload intentionally generates:
#
#   - exec
#   - shell_exec
#   - etc_changes
#
# and potentially many file deletion events depending on audit rule behavior.

AUDIT_RELEVANT="true"
