# payloads/vandalism/dns_disable/payload.conf
#
# Simulates DNS/service vandalism by stopping and disabling a DNS-related
# systemd service without deleting configuration files.
#
# This payload is intentionally disruptive inside the local lab VM, but is
# designed to be reversible through systemctl enable/start.
#
# Category:
#   vandalism

NAME="dns_disable"

CATEGORY="vandalism"

PRIVILEGE="sudo"

FAIL_POLICY="fail_fast"

CLEANUP_MODE="manual"

RANDOMIZE="false"

USES_TEMPLATE_NAMES="false"

# DNS service selection
#
# Supported:
#   resolved
#   bind
#   dnsmasq
#   custom
#
# "custom" requires TARGET_SERVICE to be set externally.
TARGET_MODE="resolved"

# Common DNS-related services.
RESOLVED_SERVICE="systemd-resolved.service"

BIND_SERVICE="bind9.service"

DNSMASQ_SERVICE="dnsmasq.service"

# Optional custom target service.
TARGET_SERVICE=""

# Safety checks
REQUIRE_SERVICE_EXISTS="true"

# Disable behavior
STOP_SERVICE="true"

DISABLE_SERVICE="true"

MASK_SERVICE="true"

# Metadata behavior
RECORD_TARGET_MODE="true"
RECORD_TARGET_SERVICE="true"
RECORD_SERVICE_ACTIVE_BEFORE="true"
RECORD_SERVICE_ENABLED_BEFORE="true"
RECORD_SERVICE_ACTIVE_AFTER="true"
RECORD_SERVICE_ENABLED_AFTER="true"

# Cleanup behavior
#
# This module does not automatically restore the service. Restore manually with:
#   systemctl unmask <service>
#   systemctl enable <service>
#   systemctl start <service>
MANUAL_CLEANUP_HINT="Re-enable DNS service with systemctl unmask/enable/start for the recorded target_service."

# Audit relevance:
#
# This payload intentionally generates:
#
#   - exec
#   - shell_exec
#   - systemctl/service management activity
#   - service disruption signals
#
# without deleting DNS configuration files.

AUDIT_RELEVANT="true"
