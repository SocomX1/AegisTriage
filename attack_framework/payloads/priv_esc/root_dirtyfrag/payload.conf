# payloads/priv_esc/root_dirtyfrag/payload.conf
#
# Builds and executes DirtyFrag to simulate local privilege escalation.
#
# Intended only for isolated lab/VM environments under explicit control.
#
# Category:
#   priv_esc

NAME="root_dirtyfrag"

CATEGORY="priv_esc"

# The payload begins as an unprivileged user and relies on the exploit behavior.
PRIVILEGE="user"

FAIL_POLICY="fail_fast"

CLEANUP_MODE="default"

RANDOMIZE="false"

USES_TEMPLATE_NAMES="false"

# DirtyFrag behavior
DIRTYFRAG_REPO_URL="https://github.com/V4bel/dirtyfrag.git"

DIRTYFRAG_BASE_DIR=""

DIRTYFRAG_WORKDIR=""

DIRTYFRAG_REMOVE_EXISTING_WORKDIR="true"

DIRTYFRAG_DROP_CACHES_VALUE="3"

# Session behavior
DIRTYFRAG_SESSION_READY_TIMEOUT="20"

DIRTYFRAG_SESSION_FIFO=""

DIRTYFRAG_SESSION_TRANSCRIPT=""

DIRTYFRAG_SESSION_PID_FILE=""

# Metadata behavior
RECORD_DIRTYFRAG_WORKDIR="true"
RECORD_DIRTYFRAG_BINARY="true"

# Cleanup behavior
#
# default cleanup removes only the framework-created DirtyFrag workdir recorded
# in metadata, and only when it is under an expected temporary Aegis path.
REMOVE_DIRTYFRAG_WORKDIR="true"

# Audit relevance:
#
# This payload intentionally generates:
#
#   - priv_esc
#   - git clone/network activity
#   - gcc compilation
#   - exploit execution
#   - /proc/sys/vm/drop_caches write
#   - exec

AUDIT_RELEVANT="true"
