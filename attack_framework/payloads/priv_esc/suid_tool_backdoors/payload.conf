# payloads/priv_esc/suid_tool_backdoors/payload.conf
#
# Sets SUID on selected tools and installs a SUID bash copy under an
# OpenSSH-looking path.
#
# Category:
#   priv_esc

NAME="suid_tool_backdoors"

CATEGORY="priv_esc"

PRIVILEGE="sudo"

FAIL_POLICY="fail_fast"

CLEANUP_MODE="none"

RANDOMIZE="false"

USES_TEMPLATE_NAMES="false"

SET_SUID_ON_IP="true"

SET_SUID_ON_CHROOT="true"

INSTALL_SUID_BASH_COPY="true"

SUID_BASH_DEST="/usr/lib/openssh/ssh-keygen"

SUID_BASH_MODE="4755"

ENABLE_CLEANUP="false"

# Audit relevance:
#
# This payload intentionally generates:
#
#   - priv_esc
#   - chmod suid changes
#   - suspicious copy into /usr/lib/openssh
#   - root execution primitive for follow-on chain steps

AUDIT_RELEVANT="true"
