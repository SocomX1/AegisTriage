# payloads/priv_esc/root_copyfail/payload.conf
#
# Executes an embedded Copy.Fail proof-of-concept to simulate local privilege
# escalation and preserve the resulting root shell.
#
# Intended only for isolated lab/VM environments under explicit control.
#
# Category:
#   priv_esc

NAME="root_copyfail"

CATEGORY="priv_esc"

# The payload begins as an unprivileged user and relies on exploit behavior.
PRIVILEGE="user"

FAIL_POLICY="fail_fast"

CLEANUP_MODE="default"

RANDOMIZE="false"

USES_TEMPLATE_NAMES="false"

# Copy.Fail behavior
COPYFAIL_BASE_DIR=""

COPYFAIL_WORKDIR=""

COPYFAIL_REMOVE_EXISTING_WORKDIR="true"

COPYFAIL_SESSION_READY_TIMEOUT="20"

COPYFAIL_SESSION_FIFO=""

COPYFAIL_SESSION_TRANSCRIPT=""

COPYFAIL_SESSION_PID_FILE=""

COPYFAIL_EXPLOIT_PATH=""

# Cleanup behavior
REMOVE_COPYFAIL_WORKDIR="true"

# Audit relevance:
#
# This payload intentionally generates:
#
#   - priv_esc
#   - python exploit execution
#   - AF_ALG/socket activity
#   - splice activity
#   - su execution
#   - root shell command execution

AUDIT_RELEVANT="true"
