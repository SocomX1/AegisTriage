# payloads/priv_esc/sudoers_mod/payload.conf
#
# Modifies sudoers policy to simulate privilege-escalation persistence.
#
# This payload is intended to model an attacker granting passwordless sudo
# access to a local account by writing a controlled file under /etc/sudoers.d/.
#
# Category:
#   priv_esc

NAME="sudoers_mod"

CATEGORY="priv_esc"

PRIVILEGE="sudo"

FAIL_POLICY="fail_fast"

CLEANUP_MODE="default"

RANDOMIZE="true"

USES_TEMPLATE_NAMES="true"

# Target user behavior
#
# If TARGET_USER is supplied externally, use it.
# Otherwise select a plausible username from templates/usernames.txt.
#
# For chains, this should usually be provided from a previous create_user step.
TARGET_USER_MODE="external_or_template"

USERNAME_TEMPLATE_POOL="usernames"

APPEND_RANDOM_SUFFIX="false"

# Sudoers behavior
SUDOERS_DIR="/etc/sudoers.d"

SUDOERS_FILE_TEMPLATE_POOL="filenames"

SUDOERS_FILE_PREFIX=""

APPEND_RANDOM_SUFFIX_TO_FILE="true"

RANDOM_SUFFIX_LENGTH="6"

# Privilege rule behavior
#
# Supported:
#   nopasswd_all
#   passwd_all
#
SUDOERS_RULE_MODE="nopasswd_all"

# File permissions expected by sudo.
SUDOERS_FILE_MODE="440"

# Validate with visudo before installing when available.
VALIDATE_WITH_VISUDO="true"

# Metadata behavior
RECORD_TARGET_USER="true"
RECORD_SUDOERS_FILE="true"
RECORD_SUDOERS_RULE_MODE="true"

# Cleanup behavior
#
# default cleanup removes only the sudoers.d file created by this payload.
REMOVE_ONLY_FRAMEWORK_SUDOERS_FILE="true"

# Audit relevance:
#
# This payload intentionally generates:
#
#   - priv_esc
#   - etc_changes
#   - chmod_change
#   - owner_change
#   - exec
#
# according to the current auditd ruleset.

AUDIT_RELEVANT="true"
