# payloads/recon/basic_enum/payload.conf
#
# Performs lightweight host/user enumeration to simulate early-stage attacker
# reconnaissance activity.
#
# This payload intentionally focuses on:
#
#   - identity discovery
#   - filesystem discovery
#   - environment discovery
#   - basic system fingerprinting
#
# while remaining relatively non-destructive.
#
# Category:
#   recon

NAME="basic_enum"

CATEGORY="recon"

PRIVILEGE="user"

FAIL_POLICY="fail_fast"

CLEANUP_MODE="none"

RANDOMIZE="false"

USES_TEMPLATE_NAMES="false"

# Enumeration groups
#
# These allow subsets of recon behavior to be toggled independently.
ENUM_USER="true"

ENUM_HOST="true"

ENUM_FILESYSTEM="true"

ENUM_NETWORK="false"

ENUM_PROCESSES="false"

ENUM_SERVICES="false"

ENUM_HISTORY="false"

# Filesystem targets
ENUM_HOME_DIRS="true"

ENUM_ETC_PASSWD="true"

ENUM_TMP_DIRS="true"

ENUM_SSH_DIRS="true"

# Network enumeration
#
# Disabled by default because it can create noisy/non-filesystem-heavy traces.
RUN_IP_ADDR="false"

RUN_SS="false"

RUN_NETSTAT="false"

# Output behavior
#
# Output is intentionally printed to stdout so the wrapper transcript captures
# the enumeration activity naturally.
VERBOSE_OUTPUT="true"

# Metadata behavior
RECORD_ENUM_GROUPS="true"

# Cleanup behavior
#
# Recon payloads intentionally leave little/no cleanup footprint.
#
# No automatic cleanup is performed.

# Audit relevance:
#
# This payload intentionally generates:
#
#   - exec
#   - shell_exec
#   - home_activity
#
# and potentially:
#
#   - tmp_activity
#
# depending on what directories/files are enumerated.

AUDIT_RELEVANT="true"
