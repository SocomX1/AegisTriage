# payloads/persistence_tasks/cron_job/payload.conf
#
# Installs a cron-based persistence task.
#
# This payload is intended to model automated persistence through recurring
# scheduled execution. It creates a staged script in a realistic temp/staging
# directory and installs a crontab entry that executes it.
#
# Category:
#   persistence_tasks

NAME="cron_job"

CATEGORY="persistence_tasks"

PRIVILEGE="user"

FAIL_POLICY="fail_fast"

CLEANUP_MODE="default"

RANDOMIZE="true"

USES_TEMPLATE_NAMES="true"

# Name generation
CRON_NAME_TEMPLATE_POOL="cron_names"

STAGING_DIR_TEMPLATE_POOL="staging_dirs"

PAYLOAD_NAME_TEMPLATE_POOL="payload_names"

APPEND_RANDOM_SUFFIX="true"

RANDOM_SUFFIX_LENGTH="6"

# Cron behavior
#
# Supported:
#   user_crontab
#   system_cron_d
#
# user_crontab is the safer default because it does not require root.
CRON_MODE="user_crontab"

# Schedule
CRON_SCHEDULE="* * * * *"

# Payload behavior
#
# The staged cron payload is intentionally simple and visible.
CRON_OUTPUT_FILE="/tmp/aegis_persist.log"

CRON_MESSAGE="simulated cron persistence"

# File permissions
STAGED_PAYLOAD_MODE="700"

# Metadata behavior
RECORD_CRON_NAME="true"
RECORD_STAGING_DIR="true"
RECORD_STAGED_PAYLOAD="true"
RECORD_CRON_SCHEDULE="true"
RECORD_CRON_MODE="true"

# Cleanup behavior
#
# default cleanup removes:
#   - the framework-created crontab line
#   - the staged payload script
#
REMOVE_ONLY_FRAMEWORK_CRON="true"

# Audit relevance:
#
# This payload intentionally generates:
#
#   - exec
#   - tmp_activity
#   - chmod_change
#   - persistence
#
# depending on CRON_MODE and audit rules.

AUDIT_RELEVANT="true"
