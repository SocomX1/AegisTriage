# payloads/persistence_tasks/systemd_watershell/payload.conf
#
# Compiles and installs the shared Watershell source as a randomized systemd
# persistence service.
#
# Category:
#   persistence_tasks

NAME="systemd_watershell"

CATEGORY="persistence_tasks"

PRIVILEGE="sudo"

FAIL_POLICY="fail_fast"

CLEANUP_MODE="default"

RANDOMIZE="true"

USES_TEMPLATE_NAMES="true"

# Name generation
SYSTEMD_SERVICE_TEMPLATE_POOL="systemd_services"

APPEND_RANDOM_SUFFIX="true"

RANDOM_SUFFIX_LENGTH="6"

# Source assets
WATERSHELL_SOURCE=""

WATERSHELL_HEADER=""

# Service layout
SERVICE_DIR_BASE="/etc"

SERVICE_DIR=""

SERVICE_BINARY_NAME=""

SYSTEMD_UNIT_DIR="/etc/systemd/system"

SERVICE_DESCRIPTION=""

SERVICE_LOG_FILE="/dev/null"

# Watershell runtime behavior
WATERSHELL_INTERFACE="eth0"

WATERSHELL_PORT_OFFSET="0"

WATERSHELL_PROMISC="false"

# Service behavior
ENABLE_SERVICE="true"

START_SERVICE="true"

# Metadata behavior
RECORD_SERVICE_NAME="true"
RECORD_SERVICE_DIR="true"
RECORD_SERVICE_BINARY_PATH="true"
RECORD_SYSTEMD_UNIT_PATH="true"

# Cleanup behavior
#
# default cleanup stops/disables the framework-created service and removes the
# staged service directory and unit recorded in metadata.
REMOVE_ONLY_RECORDED_SYSTEMD_WATERSHELL="true"

# Audit relevance:
#
# This payload intentionally generates:
#
#   - persistence
#   - systemd service installation
#   - writes under /etc
#   - gcc compilation
#   - raw socket backdoor execution
#   - daemon-reload / enable / start service activity

AUDIT_RELEVANT="true"
