# deliveries/local_controller.conf
#
# Executes a controller-side script instead of using a standardized remote
# transport.
#
# This is the "escape hatch" delivery vector for multi-step or unusual
# workflows that do not fit cleanly into ssh_stdin, scp_then_ssh, ssh_auth,
# reverse_shell, or bind_shell.
#
# Typical uses:
#
#   - starting a local HTTP server
#   - custom SCP/curl staging
#   - timing-sensitive orchestration
#   - complex reverse-shell handling
#   - mixed Windows PowerShell + WSL workflows
#   - chained behavior that needs custom control
#
# Payloads using this vector must include:
#
#   controller.sh
#
# instead of relying only on commands.sh.

NAME="local_controller"

TYPE="local_controller"

# This mode is intentionally not fully standardized.
AUTOMATED="false"

# The wrapper should execute:
#
#   payloads/<payload>/controller.sh
#
# on the controller machine.
SCRIPT_MODE="controller"

CONTROLLER_SCRIPT="controller.sh"

# Whether this delivery should send normal START/END markers.
#
# Usually true, but controller.sh may also send additional sub-markers
# if it performs multiple target-side phases.
SEND_MARKERS="true"

# Whether the controller script is responsible for its own remote cleanup.
CONTROLLER_OWNS_CLEANUP="true"

# Environment variables passed to controller.sh:
#
#   TARGET
#   RUN_ID
#   CHAIN_ID
#   FRAMEWORK_ROOT
#   RUN_DIR
#
FORWARD_ENV_VARS=(
    TARGET
    RUN_ID
    CHAIN_ID
    FRAMEWORK_ROOT
    RUN_DIR
)

# Required tools vary by controller script, so this list is intentionally small.
REQUIRED_COMMANDS=(
    bash
)

# Audit relevance:
#
# This vector's audit footprint depends entirely on what controller.sh does.
# It may produce SSH, SCP, curl, reverse-shell, bind-shell, file-staging,
# or other activity on the target.
#
# Because behavior is less standardized, controller scripts should be
# especially careful to write useful metadata.

AUDIT_RELEVANT="variable"
