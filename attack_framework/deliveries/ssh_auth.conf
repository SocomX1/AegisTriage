# deliveries/ssh_auth.conf
#
# Authenticates directly to a target account over SSH and executes the
# payload remotely.
#
# This delivery vector is intended to model:
#
#   - re-entry after persistence
#   - lateral movement using valid credentials
#   - follow-on attacker activity after account creation
#
# Typical usage:
#
#   Step 1:
#       reverse shell creates a new account
#
#   Step 2:
#       ssh_auth uses that account to reconnect
#
# This vector intentionally produces:
#   - ssh login events
#   - execve activity under the new account
#   - shell spawning activity
#
# IMPORTANT:
#   This is intended only for local lab/VM environments under your control.

NAME="ssh_auth"

TYPE="ssh_auth"

# Whether the vector should execute automatically.
AUTOMATED="true"

# Authentication mode
#
# Supported:
#   password
#   key
#
# Current framework implementation defaults to password auth.
SSH_AUTH_MODE="password"

USERNAME="${USERNAME:-analyst}"
PASSWORD="${PASSWORD:-password}"

# SSH behavior
SCRIPT_MODE="stdin"

# SSH options
STRICT_HOST_KEY_CHECKING="false"
USER_KNOWN_HOSTS_FILE="/dev/null"

# Whether the wrapper should suppress first-time SSH prompts.
DISABLE_HOST_KEY_PROMPTS="true"

# Connection retry settings
SSH_CONNECT_RETRIES="3"
SSH_CONNECT_RETRY_DELAY="2"

# Execution behavior
USE_TTY="false"

# Delay settings
POST_AUTH_DELAY="1"
POST_EXECUTION_DELAY="1"

# Metadata behavior
RECORD_AUTH_USERNAME="true"
RECORD_AUTH_METHOD="true"

CAPTURE_METADATA_FIELDS=(
    ssh_username
    ssh_auth_mode
)

# Required tools
REQUIRED_COMMANDS=(
    ssh
    sshpass
)

# Environment propagation
#
# These variables are forwarded into the remote shell.
FORWARD_ENV_VARS=(
    RUN_ID
    CHAIN_ID
    FRAMEWORK_ROOT
)

# Audit relevance
#
# This vector intentionally produces:
#   - exec
#   - shell_exec
#   - home_activity
#
# and potentially:
#   - auth.log / journal SSH events
#
# depending on system configuration.

AUDIT_RELEVANT="true"

# Example usage:
#
#   USERNAME="svc_backup"
#   PASSWORD="ReusableLabPassword123!"
#
#   ./run_attack.sh \
#       analyst@192.168.52.20 \
#       ssh_auth \
#       vandalism/nginx_delete
#
# The wrapper expects:
#   USERNAME
#   PASSWORD
#
# to already be present in the environment.
