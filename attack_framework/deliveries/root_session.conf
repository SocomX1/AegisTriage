# deliveries/root_session.conf
#
# Executes payloads through a previously established interactive shell session.
# The current implementation supports FIFO-backed sessions published by an
# earlier payload through shell_session_* metadata fields.

NAME="root_session"

TYPE="root_session"

AUTOMATED="true"

DESCRIPTION="Execute payload through a preserved privileged shell session."

# Shell session behavior
SESSION_TYPE="${AEGIS_SHELL_SESSION_TYPE:-fifo}"

SESSION_INPUT="${AEGIS_SHELL_SESSION_INPUT:-}"

SESSION_TRANSCRIPT="${AEGIS_SHELL_SESSION_TRANSCRIPT:-}"

SESSION_USER="${AEGIS_SHELL_SESSION_USER:-root}"

SESSION_COMMAND_TIMEOUT="${AEGIS_SHELL_SESSION_COMMAND_TIMEOUT:-45}"

SESSION_POLL_INTERVAL="${AEGIS_SHELL_SESSION_POLL_INTERVAL:-1}"

# SSH behavior used only to write to the remote FIFO and read transcript state.
STRICT_HOST_KEY_CHECKING="false"
USER_KNOWN_HOSTS_FILE="/dev/null"

AUDIT_RELEVANT="true"
