# Delivery: ssh_stdin
#
# Runs the selected payload by piping commands.sh into bash over SSH.
# No payload file is written to disk on the target.
#
# Best for:
#   - minimizing target-side setup artifacts
#   - clean execution of atomic payloads
#   - comparing payload behavior without upload noise

NAME="ssh_stdin"
TYPE="ssh"
AUTOMATED="true"

SCRIPT_MODE="stdin"

DESCRIPTION="Execute payload over SSH using bash stdin without uploading a script file."

# Expected wrapper behavior:
#   ssh "$TARGET" "RUN_ID='$RUN_ID' bash -s" < payloads/<payload>/commands.sh
