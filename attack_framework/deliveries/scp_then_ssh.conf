# deliveries/scp_then_ssh.conf
#
# Uploads the payload to the target using SCP, then executes it remotely.
#
# This delivery vector is useful when you explicitly WANT the following
# behaviors to appear in audit.log:
#
#   - scp execution
#   - file creation in staging directories
#   - chmod/chown events
#   - execution from temp/staging locations
#
# Upload filenames and directories are intentionally randomized/template-based
# to reduce model bias.

NAME="scp_then_ssh"

TYPE="scp_then_ssh"

# Whether this delivery vector should attempt fully automated execution.
AUTOMATED="true"

# Upload behavior
SCRIPT_MODE="uploaded"

# Randomization behavior
RANDOMIZE_UPLOAD_PATHS="true"
RANDOMIZE_UPLOAD_FILENAMES="true"

# Template pools
UPLOAD_DIR_TEMPLATE="staging_dirs"
UPLOAD_FILENAME_TEMPLATE="payload_names"

# Append a random suffix to uploaded payload names.
APPEND_RANDOM_SUFFIX="true"

# Uploaded payload permissions
REMOTE_CHMOD="700"

# Whether the wrapper should remove uploaded payloads afterward.
# Payload cleanup behavior is still governed separately by payload.conf.
REMOVE_UPLOADED_PAYLOAD="true"

# Delay settings (seconds)
POST_UPLOAD_DELAY="1"
POST_EXECUTION_DELAY="1"

# Logging behavior
RECORD_REMOTE_PATH="true"
RECORD_UPLOAD_FILENAME="true"

# Metadata fields to capture automatically
CAPTURE_METADATA_FIELDS=(
    remote_payload
    upload_directory
    upload_filename
)

# Network tools expected to exist
REQUIRED_COMMANDS=(
    scp
    ssh
)

# Audit relevance
#
# This vector intentionally produces:
#   - download_tool
#   - tmp_activity
#   - chmod_change
#   - exec
#
# according to the current auditd ruleset.

AUDIT_RELEVANT="true"
