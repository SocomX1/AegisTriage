# deliveries/suid_exec.conf
#
# Executes payloads through a previously installed SUID bash root execution
# primitive published by root_exec_* metadata.

NAME="suid_exec"

TYPE="suid_exec"

AUTOMATED="true"

DESCRIPTION="Execute payload through a preserved SUID bash root execution primitive."

ROOT_EXEC_METHOD="${AEGIS_ROOT_EXEC_METHOD:-suid_bash}"

ROOT_EXEC_PATH="${AEGIS_ROOT_EXEC_PATH:-}"

ROOT_EXEC_ARGS="${AEGIS_ROOT_EXEC_ARGS:--p}"

ROOT_EXEC_CHROOT_PATH="${AEGIS_ROOT_EXEC_CHROOT_PATH:-}"

REMOTE_STAGE_DIR="${AEGIS_SUID_EXEC_REMOTE_STAGE_DIR:-/tmp}"

SUID_EXEC_TIMEOUT="${AEGIS_SUID_EXEC_TIMEOUT:-45}"

AUDIT_RELEVANT="true"
